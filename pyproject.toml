[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dreamlab-hack"
version = "0.1.0"
description = "Local robot workflow and statistical evaluation integration scaffold"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
local = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
eval = ["numpy>=2,<3", "scipy>=1.14,<2", "statsmodels>=0.14,<0.16"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[project.scripts]
dream-local = "dreamlab.local.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dreamlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["statistical: seeded simulation checks of statistical operating characteristics"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
