[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dreamlab-hack"
version = "0.1.0"
description = "Standalone robot checkpoint statistical evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3"]

[project.scripts]
dream-eval = "dreamlab.evaluation.cli:main"

[project.optional-dependencies]
eval = ["numpy>=2,<3", "scipy>=1.14,<2", "statsmodels>=0.14,<0.16"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/dreamlab"]

[tool.hatch.build.targets.wheel.force-include]
"uv.lock" = "dreamlab/uv.lock"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["statistical: seeded simulation checks of statistical operating characteristics"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
