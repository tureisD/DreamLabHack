name: evaluation-checks
on:
  push:
    branches: [main, codex/stat-eval]
  pull_request:
    branches: [main, codex/stat-eval]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - run: uv sync --locked --all-extras --group dev
      - run: uv run --locked --all-extras ruff check .
      - run: uv run --locked --all-extras ruff format --check .
      - run: uv run --locked --all-extras pytest
      - run: uv build
