name: evaluation-checks
on:
  push:
    branches: [main, codex/stat-eval, codex/stat-eval-implementation, codex/stat-eval-extensions]
  pull_request:
    branches: [main, codex/stat-eval, codex/stat-eval-extensions]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - run: uv sync --locked --all-extras --group dev
      - run: uv run --locked --all-extras ruff check src tests
      - run: uv run --locked --all-extras ruff format --check src tests
      - run: uv run --locked --all-extras pytest
      - run: uv build
      - name: Verify fresh wheel and platform CLI behavior
        run: uv run --locked --all-extras python tests/evaluation/wheel_smoke.py
